// sine_input.ini
// Signal function to generate a 60Hz sine wave voltage input

signal void sine_wave (void) {
  float frequency;
  float amplitude;
  float offset;
  float time; 
  float pi;

  // --- CONFIGURATION PARAMETERS ---
  frequency = 60.0;   // Frequency in Hz
  amplitude = 1.65;   // Amplitude in Volts (Peak-to-Peak will be 3.3V)
  offset = 1.65;      // DC Offset in Volts (Shifts the wave so it doesn't go below 0V)
  pi = 3.1415926535;
  time = 0.0;         // Starting time

  while (1) {
    // Calculate current voltage
    // Replace 'AIN0' with your specific microcontroller's analog pin / Virtual Register
    AIN0 = offset + (amplitude * __sin(2.0 * pi * frequency * time));
    
    // Wait for 1 millisecond (0.001 seconds) simulator time
    swatch(0.001); 
    
    // Advance time by 1 millisecond
    time += 0.001; 
  }
}

// Automatically start the signal function when the debugger launches
sine_wave();